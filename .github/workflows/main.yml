name: Build and release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Release - ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: rlviser
            artifact_bin: rlviser-x86_64-unknown-linux-gnu
            name: rlviser-x86_64-unknown-linux-gnu.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rlviser.exe
            artifact_bin: rlviser-x86_64-pc-windows-msvc.exe
            name: rlviser-x86_64-pc-windows-msvc.zip

          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rlviser
            artifact_bin: rlviser-aarch64-apple-darwin
            name: rlviser-aarch64-apple-darwin.tar.gz

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get required packages (Linux only)
        if: contains(matrix.platform.os, 'ubuntu')
        run: sudo apt update && sudo apt install g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@v2
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platform.target }}
          args: "--release --no-default-features --locked"
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}" "dist/${{ matrix.platform.artifact_bin }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.target }}
          path: dist/${{ matrix.platform.artifact_bin }}
  publish:
    needs: [release]
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: ./**/target/**
          generate_release_notes: true
          body: |
            Extra keybinds for RLViser are included in the README
